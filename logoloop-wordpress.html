<!--
  LogoLoop — WordPress Custom HTML Block
  =======================================
  Paste this entire snippet into a Custom HTML block.

  TO USE YOUR OWN LOGOS
  ─────────────────────
  Replace each inline <svg> block with an <img> tag pointing to your
  WordPress Media Library URL, e.g.:

    <li class="ll-item">
      <a href="https://yoursite.com" target="_blank" rel="noopener noreferrer">
        <img src="https://yoursite.com/wp-content/uploads/logo.png" alt="Company Name">
      </a>
    </li>

  Or without a link:

    <li class="ll-item">
      <img src="https://yoursite.com/wp-content/uploads/logo.png" alt="Company Name">
    </li>

  TO ADJUST SETTINGS: edit the config variables near the bottom in the <script> block.
  TO ADD MORE LOGOS:  copy any <li class="ll-item">…</li> and paste it inside the <ul>.
  TO CHANGE FADE COLOR: set --ll-bg in the <style> to match your page background.
-->

<style>
  .ll-wrap {
    position: relative;
    overflow: hidden;
    width: 100%;
    /* ↓ Change to your page/section background colour */
    --ll-bg: #ffffff;
  }

  .ll-track {
    display: flex;
    width: max-content;
    will-change: transform;
    user-select: none;
    align-items: center;
  }

  .ll-list {
    display: flex;
    align-items: center;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .ll-item {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* shared rules for both <img> and inline <svg> logos */
  .ll-item img,
  .ll-item svg {
    display: block;
    width: auto;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                opacity  0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .ll-item a {
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    border-radius: 4px;
  }

  .ll-item a:hover img,
  .ll-item a:hover svg {
    opacity: 0.75;
    transform: scale(1.08);
  }

  .ll-item a:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
  }

  /* fade edges */
  .ll-wrap::before,
  .ll-wrap::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    width: clamp(24px, 8%, 100px);
    pointer-events: none;
    z-index: 10;
  }
  .ll-wrap::before {
    left: 0;
    background: linear-gradient(to right, var(--ll-bg) 0%, transparent 100%);
  }
  .ll-wrap::after {
    right: 0;
    background: linear-gradient(to left, var(--ll-bg) 0%, transparent 100%);
  }

  @media (prefers-reduced-motion: reduce) {
    .ll-track { transform: translate3d(0, 0, 0) !important; }
    .ll-item img,
    .ll-item svg { transition: none !important; }
  }
</style>

<div class="ll-wrap" id="ll-instance-1">
  <div class="ll-track">
    <ul class="ll-list">

      <!--
        Demo logos (inline SVG — no external requests, never break).
        Replace these <li> blocks with your own <img> tags when ready.
      -->

      <li class="ll-item">
        <a href="https://example.com" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 48" role="img" aria-label="Nova">
            <polygon points="22,10 34,4 46,10 46,28 34,34 22,28" fill="#4f46e5"/>
            <text x="34" y="21" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" dy="0.35em">N</text>
            <text x="62" y="24" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="start" dy="0.35em" letter-spacing="1">NOVA</text>
          </svg>
        </a>
      </li>

      <li class="ll-item">

            <polygon points="34,6 46,30 22,30" fill="#0ea5e9"/>
            <text x="62" y="24" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#0c4a6e" text-anchor="start" dy="0.35em" letter-spacing="1">APEX</text>
          </svg>
        </a>
      </li>

      <li class="ll-item">
        <a href="https://example.com" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" role="img" aria-label="Crest">
            <path d="M14,30 A20,20 0 0,1 54,30" stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round"/>
            <circle cx="34" cy="30" r="3" fill="#10b981"/>
            <text x="66" y="24" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#064e3b" text-anchor="start" dy="0.35em" letter-spacing="1">CREST</text>
          </svg>

      </li>

      <li class="ll-item">
        <a href="https://example.com" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 48" role="img" aria-label="Flux">
            <polygon points="34,6 46,22 38,22 42,42 22,26 30,26" fill="#f59e0b"/>
            <text x="58" y="24" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#78350f" text-anchor="start" dy="0.35em" letter-spacing="1">FLUX</text>
          </svg>
        </a>
      </li>

      <li class="ll-item">
        <a href="https://example.com" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 48" role="img" aria-label="Stride">
            <rect x="14" y="16" width="32" height="16" rx="8" fill="#8b5cf6"/>
            <polygon points="40,12 52,24 40,36" fill="#8b5cf6"/>
            <text x="66" y="24" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#3b0764" text-anchor="start" dy="0.35em" letter-spacing="1">STRIDE</text>

      <li class="ll-item">
        <a href="https://example.com" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 48" role="img" aria-label="Orbit">
            <circle cx="34" cy="24" r="16" stroke="#e11d48" stroke-width="4" fill="none"/>
            <ellipse cx="34" cy="24" rx="8" ry="16" stroke="#e11d48" stroke-width="2.5" fill="none"/>
            <text x="62" y="24" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="700" fill="#881337" text-anchor="start" dy="0.35em" letter-spacing="1">ORBIT</text>
          </svg>
        </a>
      </li>

    </ul>
  </div>
</div>

<script>
(function () {
  /* ── CONFIGURATION ───────────────────────────────────────────── */
  var LOGO_HEIGHT = 48;   /* logo height in px                      */
  var GAP         = 56;   /* gap between logos in px                 */
  var SPEED       = 80;   /* scroll speed in px/second               */
  var HOVER_SPEED = 0;    /* speed on hover — 0 pauses, or use lower */
  var SMOOTH_TAU  = 0.25; /* easing amount (higher = slower ease-in) */
  /* ───────────────────────────────────────────────────────────── */

  var wrap     = document.getElementById('ll-instance-1');
  var track    = wrap.querySelector('.ll-track');
  var origList = wrap.querySelector('.ll-list');

  wrap.style.height = LOGO_HEIGHT * 1.5 + 'px';

  function applyStyles(list) {
    list.querySelectorAll('.ll-item').forEach(function (item) {
      item.style.marginRight = GAP + 'px';
    });
    list.querySelectorAll('img, svg').forEach(function (el) {
      el.style.height = LOGO_HEIGHT + 'px';
    });
  }

  applyStyles(origList);

  var seqWidth  = 0;
  var velocity  = 0;
  var offset    = 0;
  var isHovered = false;
  var lastTime  = null;
  var rafId     = null;
  var clones    = [];

  function setup() {
    clones.forEach(function (c) { if (c.parentNode) c.parentNode.removeChild(c); });
    clones = [];

    seqWidth = Math.ceil(origList.getBoundingClientRect().width);
    if (seqWidth === 0) return;

    var needed = Math.max(2, Math.ceil(wrap.clientWidth / seqWidth) + 2);

    for (var i = 0; i < needed; i++) {
      var clone = origList.cloneNode(true);
      clone.setAttribute('aria-hidden', 'true');
      applyStyles(clone);
      track.appendChild(clone);
      clones.push(clone);
    }
  }

  function animate(ts) {
    if (lastTime === null) lastTime = ts;
    var dt = Math.max(0, ts - lastTime) / 1000;
    lastTime = ts;

    var target = isHovered ? HOVER_SPEED : SPEED;
    velocity  += (target - velocity) * (1 - Math.exp(-dt / SMOOTH_TAU));

    if (seqWidth > 0) {
      offset = ((offset + velocity * dt) % seqWidth + seqWidth) % seqWidth;
      track.style.transform = 'translate3d(' + (-offset) + 'px, 0, 0)';
    }

    rafId = requestAnimationFrame(animate);
  }

  function start() {
    if (rafId) cancelAnimationFrame(rafId);
    lastTime = null;
    rafId    = requestAnimationFrame(animate);
  }

  wrap.addEventListener('mouseenter', function () { isHovered = true; });
  wrap.addEventListener('mouseleave', function () { isHovered = false; });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(setup, 100);
  });

  /* wait for any <img> logos to load before measuring */
  var imgs    = Array.prototype.slice.call(origList.querySelectorAll('img'));
  var pending = imgs.length;

  if (pending === 0) { setup(); start(); return; }

  imgs.forEach(function (img) {
    if (img.complete) {
      if (--pending === 0) { setup(); start(); }
    } else {
      img.addEventListener('load',  function () { if (--pending === 0) { setup(); start(); } }, { once: true });
      img.addEventListener('error', function () { if (--pending === 0) { setup(); start(); } }, { once: true });
    }
  });
})();
</script>
